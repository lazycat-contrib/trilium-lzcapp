version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: trilium
build:
  toolchains: []
  run_buildscript: false
images:
  - id: trilium
    target: service
    service: trilium
    source: ghcr.io/triliumnext/trilium
    channel: stable
    sort: semver
    tag_regex: '^v0[.]106[.][0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Trilium
    skip_if_version_exists: true
