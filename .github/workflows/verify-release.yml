name: Verify Trilium Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact LPK release tag
        required: true
        default: v0.106.1
        type: string
permissions:
  contents: read
concurrency:
  group: trilium-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download exact Release asset on runner
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="community.lazycat.app.trilium-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg
      - name: Verify artifact, data ownership and license notice
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML==6.0.3'])
              import yaml

          name = os.environ['ASSET_NAME']
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')

          meta = json.loads(Path('release-metadata.json').read_text())
          assets = [a for a in meta['assets'] if a['name'] == name]
          assert len(assets) == 1, assets
          pkg = Path('verify-pkg') / name

          h = hashlib.sha256()
          with pkg.open('rb') as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          assert 'sha256:' + h.hexdigest() == assets[0]['digest'], 'Release digest mismatch'

          with tarfile.open(pkg) as package:
              names = set(package.getnames())
              assert {'package.yml', 'manifest.yml', 'content.tar', 'icon.png'} <= names, names

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.trilium'
              assert str(info['version']) == version
              assert info['name'] == 'Trilium'
              assert info['license'] == 'AGPL-3.0'
              assert str(info['min_os_version']) == '1.5.0'
              assert 'net.internet' in info['permissions']['required']

              text = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(text)
              app = m['application']
              assert app['subdomain'] == 'trilium'
              upstreams = app['upstreams']
              assert any(u['location'] == '/package-licenses/' and u['backend'].startswith('file://') for u in upstreams)
              assert any(u['location'] == '/' and u['backend'] == 'http://trilium:8080/' for u in upstreams)
              # A knowledge base has no headless client API; nothing may be exposed without entry auth.
              assert 'public_path' not in app, app.get('public_path')
              assert 'injects' not in app, 'no autofill expected for a self-chosen vault password'

              svc = m['services']['trilium']
              assert svc['image'].startswith('ghcr.1ms.run/triliumnext/trilium:')
              assert svc['binds'] == ['/lzcapp/var/data:/data']
              assert svc['environment'] == ['TRILIUM_DATA_DIR=/data']
              setup = svc['setup_script']
              assert 'mkdir -p /data' in setup
              assert 'chown -R 1000:1000 /data' in setup
              assert 'user' not in svc and 'run_as' not in svc
              assert 'healthcheck' not in text
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  members = content.getnames()
                  hits = [n for n in members if n.removeprefix('./') == 'licenses/COPYING.txt']
                  assert len(hits) == 1, hits
                  license_text = content.extractfile(hits[0]).read().decode()
              assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in license_text
              assert 'Version 3' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Independent cloud artifact verification\n\n' + json.dumps(result, indent=2) + '\n')
